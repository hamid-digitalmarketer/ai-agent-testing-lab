[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-testing-lab"
version = "0.1.0"
description = "Reusable reliability and evaluation lab for every AI marketing agent in the portfolio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hamid", email = "hamid.digitalmarketer@gmail.com" }]
keywords = ["ai", "agents", "evaluation", "reliability", "marketing", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "ai-marketing-shared>=0.1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Optional target used by the lab self-evaluation and by downstream repos
# that want to evaluate the flagship platform.
targets = [
    "ai-marketing-growth-os>=0.1.0",
]

[project.scripts]
lab-eval = "lab.cli:main"

[tool.setuptools]
packages = ["lab", "evaluation", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
addopts = "-q --cov=lab --cov=fixtures --cov=evaluation --cov-report=term-missing"
markers = [
    "target: tests that require ai-marketing-growth-os (skipped when not installed)",
]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.coverage.run]
source = ["lab", "fixtures", "evaluation"]
omit = ["lab/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["lab", "evaluation", "fixtures", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM105"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["infra/", ".github/", "integration/", "tests/"]
